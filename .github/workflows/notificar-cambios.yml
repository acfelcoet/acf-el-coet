name: Avisar de canvis en la web

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "css/**"
      - "js/**"
      - "img/**"
      - "icons/**"
      - "manifest.json"
      # La còpia de proves no avisa ningú.
      - "!copia/**"

  workflow_dispatch:
    inputs:
      titulo:
        description: "Título del aviso"
        required: true
        default: "ACF EL COET"
      mensaje:
        description: "Texto del aviso"
        required: true
      destino:
        description: "Página a abrir (opcional, ej: programa.html)"
        required: false

permissions:
  contents: read

concurrency:
  group: avisar-canvis
  cancel-in-progress: false

jobs:
  avisar:
    name: Enviar aviso push
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del notificador
        run: npm --prefix tools/notificar install --no-audit --no-fund

      - name: Enviar el aviso
        run: node tools/notificar/index.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TITULO: ${{ inputs.titulo }}
          MENSAJE: ${{ inputs.mensaje }}
          URL_DESTINO: ${{ inputs.destino }}
          SITE_URL: https://acfelcoet.github.io/acf-el-coet/
