name: Prova avis (un dispositiu)

# Envia un avís NOMÉS als dispositius de la còpia de proves (/copia/),
# que es guarden a la col·lecció fcmTokensProva. La web oficial no rep res.
#
# Ús: Actions → "Prova avis (un dispositiu)" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título del aviso"
        required: true
        default: "NOVETATS · ACF EL COET"
      mensaje:
        description: "Texto del aviso"
        required: true
        default: "Hi ha una imatge nova a la carpeta NOVETATS. Mira-la!"
      destino:
        description: "Página o imagen a abrir"
        required: false
        default: "copia/NOVETATS/novetat-1.jpg"
      dispositiu:
        description: "Filtrar por dispositivo (ej: iPhone). Vacío = todos los de la prueba"
        required: false

permissions:
  contents: read

concurrency:
  group: avis-prova
  cancel-in-progress: false

jobs:
  avisar:
    name: Enviar aviso de prueba
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del notificador
        run: npm --prefix tools/notificar install --no-audit --no-fund

      - name: Enviar el aviso
        run: node tools/notificar/index.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COLECCIO: fcmTokensProva
          FILTRO_UA: ${{ inputs.dispositiu }}
          TITULO: ${{ inputs.titulo }}
          MENSAJE: ${{ inputs.mensaje }}
          URL_DESTINO: ${{ inputs.destino }}
          SITE_URL: https://acfelcoet.github.io/acf-el-coet/
